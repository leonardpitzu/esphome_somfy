name: CI

on:
  push:
    branches: [master]
    paths-ignore: ["**.md", ".gitignore", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", ".gitignore", "LICENSE"]
  schedule:
    # Monthly build to catch breakage from ESPHome updates: the cron fires every
    # Monday, and schedule-gate lets only the first Monday of the month through
    # (cron day-of-month and day-of-week combine with OR, so cron alone can't).
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schedule-gate:
    name: Schedule gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%-d)" -le 7 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  ruff:
    name: Lint (Ruff)
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Check for errors
        run: ruff check .

  tests:
    name: Tests
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      # Floor is a ratchet against regression, not a target. Much of cover.py is
      # async to_code() codegen that only the ESPHome compile jobs exercise.
      - name: Run tests
        run: pytest tests/ -v --cov=components/somfy --cov-report=term-missing --cov-fail-under=50

  cpp-tests:
    name: Host tests (C++)
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The protocol test uses OpenSSL as an independent AES oracle on Linux
      # (CommonCrypto on macOS).
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      # Compile production sources against the minimal host stubs.
      - name: Run C++ suites
        run: tests/cpp/run.sh

  esphome-compile:
    name: ESPHome Compile (${{ matrix.fixture }})
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        fixture:
          - test_iohc_1w
          - test_iohc_1w_arduino
          - test_iohc_2w
          - test_iohc_manager
          - test_rts_tx_only
          - test_rts_rx
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install esphome
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('components/**') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Compile ${{ matrix.fixture }}
        run: esphome compile tests/fixtures/${{ matrix.fixture }}.yaml
